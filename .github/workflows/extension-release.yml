name: Extension release package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global pnpm@10.28.1

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build release package
        shell: powershell
        run: .\scripts\package-release.ps1

      - name: Smoke-test extension
        shell: powershell
        run: .\scripts\smoke-extension.ps1 -SkipBuild

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BookBridge-extension
          path: dist/release/BookBridge-extension.zip
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = 'dist\release\BookBridge-extension.zip'
          gh release create $env:GITHUB_REF_NAME $archive `
            --repo $env:GITHUB_REPOSITORY `
            --generate-notes `
            --title "BookBridge $env:GITHUB_REF_NAME"
